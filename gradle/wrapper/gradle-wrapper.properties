#!/usr/bin/env python3
"""
驾考模拟器 - 资源占位文件生成脚本
运行: python3 generate_resources.py
输出: placeholder_assets/ 目录（复制到 app/src/main/assets/ 即可通过 AAssetManager 加载）
"""

import struct
import zlib
import os
import math

OUT_DIR = os.path.join(os.path.dirname(__file__), "placeholder_assets")
os.makedirs(OUT_DIR, exist_ok=True)

# ============================================================
# 1. PNG 占位纹理 (单色 64x64)
# ============================================================
def create_png(name: str, r: int, g: int, b: int, a: int = 255, w: int = 64, h: int = 64):
    """创建最小 PNG 文件 —— 单色填充"""
    def chunk(ctype, data):
        c = ctype + data
        return struct.pack(">I", len(data)) + c + struct.pack(">I", zlib.crc32(c) & 0xffffffff)

    signature = b"\x89PNG\r\n\x1a\n"
    ihdr = chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))  # 8bit RGB

    raw = b""
    for y in range(h):
        raw += b"\x00"  # filter none
        for x in range(w):
            raw += bytes([r, g, b])

    idat = chunk(b"IDAT", zlib.compress(raw))
    iend = chunk(b"IEND", b"")

    path = os.path.join(OUT_DIR, name)
    with open(path, "wb") as f:
        f.write(signature + ihdr + idat + iend)
    print(f"  [TEX] {name} ({w}x{h})")

# 生成所有纹理
textures = {
    "car_body.png": (220, 220, 220),          # 车身白
    "car_glass.png": (100, 150, 200, 180),    # 玻璃蓝半透
    "car_wheel.png": (40, 40, 40),            # 轮胎黑
    "ground_asphalt.png": (60, 60, 60),       # 沥青地面
    "ground_concrete.png": (180, 180, 170),   # 混凝土地面
    "ground_grass.png": (76, 175, 80),        # 草地
    "ground_line.png": (255, 255, 255),       # 车道线
    "ground_curb.png": (200, 50, 50),         # 路缘石
    "building_wall.png": (200, 190, 170),     # 建筑墙面
    "building_roof.png": (150, 50, 30),       # 屋顶
    "skybox_up.png": (30, 60, 120),           # 天空顶
    "skybox_side.png": (80, 140, 230),        # 天空侧
    "skybox_down.png": (80, 80, 80),          # 天空底
}

for name, color in textures.items():
    r, g, b = color[0], color[1], color[2]
    a = color[3] if len(color) > 3 else 255
    create_png(name, r, g, b, a)

# ============================================================
# 2. OBJ 占位 3D 模型
# ============================================================
def write_obj(filename: str, vertices: list, normals: list, faces: list):
    path = os.path.join(OUT_DIR, filename)
    with open(path, "w") as f:
        for v in vertices:
            f.write(f"v {v[0]:.4f} {v[1]:.4f} {v[2]:.4f}\n")
        for n in normals:
            f.write(f"vn {n[0]:.4f} {n[1]:.4f} {n[2]:.4f}\n")
        for face in faces:
            f.write("f " + " ".join(f"{fi}//{fi}" for fi in face) + "\n")
    print(f"  [OBJ] {filename} ({len(vertices)} verts, {len(faces)} faces)")

# 简易教练车（箱体+轮子）
car_verts = [
    # 车身（长方体 4.5 x 1.5 x 1.8）
    (-2.0, 0.0, 0.9), (2.0, 0.0, 0.9), (2.0, 1.5, 0.9), (-2.0, 1.5, 0.9),
    (-2.0, 0.0, -0.9), (2.0, 0.0, -0.9), (2.0, 1.5, -0.9), (-2.0, 1.5, -0.9),
    # 驾驶舱（上凸 2.0 x 1.5 x 1.0, 前后偏移）
    (-1.0, 1.5, 0.5), (1.0, 1.5, 0.5), (1.0, 2.5, 0.5), (-1.0, 2.5, 0.5),
    (-1.0, 1.5, -0.5), (1.0, 1.5, -0.5), (1.0, 2.5, -0.5), (-1.0, 2.5, -0.5),
]
car_norms = [(0,0,1),(0,1,0),(1,0,0),(0,0,-1),(0,-1,0),(-1,0,0)]
car_faces = [
    (1,2,3,4),(5,8,7,6),(1,5,6,2),(2,6,7,3),(3,7,8,4),(4,8,5,1),
    (9,10,11,12),(13,16,15,14),(9,13,14,10),(10,14,15,11),(11,15,16,12),(12,16,13,9),
]
write_obj("car_body.obj", car_verts, car_norms, car_faces)

# 科目二各场地简化模型
# 倒车入库区域
reversing_verts = [(-5,0,-8),(5,0,-8),(5,0,8),(-5,0,8),(7,0,-9),(7,0,9),(-7,0,-9),(-7,0,9)]
reversing_faces = [(1,2,3,4),(1,5,7,1),(2,6,8,2)]
write_obj("subject2_reversing.obj", reversing_verts, [(0,1,0)]*8, reversing_faces)

# 侧方停车区域
sidepark_verts = [(-3,0,-6),(3,0,-6),(3,0,6),(-3,0,6),(1.5,0,-7),(1.5,0,7),(-1.5,0,-7),(-1.5,0,7)]
write_obj("subject2_sidepark.obj", sidepark_verts, [(0,1,0)]*8, [(1,2,3,4)])

# 坡道
ramp_verts = []
for z in range(-5, 6):
    h = max(0, (z + 5) * 0.15)
    ramp_verts.append((-3.5, h, z))
    ramp_verts.append((3.5, h, z))
ramp_faces = [(i*2+1, i*2+2, (i+1)*2+2, (i+1)*2+1) for i in range(10)]
write_obj("subject2_ramp.obj", ramp_verts, [(0,1,0)]*len(ramp_verts), ramp_faces)

# S 弯
s_verts = []
for i in range(40):
    t = i / 39 * math.pi * 2
    x = math.sin(t) * 12
    z = t * 6 - 12
    s_verts.append((x - 2.5, 0, z))
    s_verts.append((x + 2.5, 0, z))
s_faces = [(i*2+1, i*2+2, (i+1)*2+2, (i+1)*2+1) for i in range(39)]
write_obj("subject2_curve.obj", s_verts, [(0,1,0)]*len(s_verts), s_faces)

# 直角转弯
turn_verts = [(-3.5,0,0),(3.5,0,0),(3.5,0,10),(-3.5,0,10),(3.5,0,0),(10,0,0),(10,0,3.5),(3.5,0,3.5)]
write_obj("subject2_turn.obj", turn_verts, [(0,1,0)]*8, [(1,2,3,4),(5,6,7,8)])

# 科目三城市道路（简化路面）
road_verts = [(-5,0,-750),(5,0,-750),(5,0,750),(-5,0,750)]
write_obj("subject3_road.obj", road_verts, [(0,1,0)]*4, [(1,2,3,4)])

# 通用道具
# 交通锥
cone_verts = []
for i in range(8):
    a = i / 8 * math.pi * 2
    cone_verts.append((0.3 * math.cos(a), 0.0, 0.3 * math.sin(a)))
    cone_verts.append((0.05 * math.cos(a), 1.0, 0.05 * math.sin(a)))
cone_faces = [(i*2+1, i*2+2, ((i+1)%8)*2+2, ((i+1)%8)*2+1) for i in range(8)]
write_obj("prop_cone.obj", cone_verts, [(0,1,0)]*len(cone_verts), cone_faces)

print("资源占位文件生成完成！")

# ============================================================
# 3. WAV 占位音频 (静音)
# ============================================================
def create_wav(filename: str, duration_sec: float = 0.5, sample_rate: int = 44100):
    """创建最小 WAV 文件 —— 静音"""
    num_samples = int(sample_rate * duration_sec)
    data_size = num_samples * 2  # 16-bit mono
    path = os.path.join(OUT_DIR, filename)
    with open(path, "wb") as f:
        f.write(b"RIFF")
        f.write(struct.pack("
<parameter name="content" string="true">distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
